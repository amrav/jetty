name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing is a fact about that version; keep the others
      # running so the report says which.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        # --locked: the lockfile is the contract; a pyproject edit without a
        # committed re-lock fails here instead of silently floating versions.
        run: uv sync --locked --extra dev

      - name: Validate the shipped example config
        run: uv run jetty --config jetty.example.toml --check

      - name: Tests
        run: uv run python tests/run_all.py

      - name: Tests, with a temp root outside /tmp
        # The suite must never assume a writable /tmp: absltest picks the temp
        # root from TEST_TMPDIR, and a build environment may sandbox /tmp away
        # entirely. runner.temp is under the workspace, so this run would fail
        # on any test that reached for a hardcoded path.
        env:
          TEST_TMPDIR: ${{ runner.temp }}/jetty-tests
        run: uv run python tests/run_all.py
