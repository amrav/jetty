[project]
name = "jetty"
version = "0.1.0"
description = "Modular sidecar for interop between OSS binaries and internal infrastructure"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
sql = [
    "sqlglot>=25",          # the sql module's GoogleSQL-side dialect gate
]
dev = [
    "absl-py>=2.1",         # absltest: test runner plus managed temp files/dirs
    "httpx>=0.27",          # test client + the conformance suite's HTTP transport
    "mercurial>=6.6",       # the hg module's tests seed real repositories
    "sqlglot>=25",          # the sql module's tests exercise the dialect gate
]

[project.scripts]
jetty = "jetty.cli:main"
jetty-orc = "jetty.orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetty"]
