[project]
name = "jetty-fsspec"
version = "0.1.0"
description = "fsspec backend for the Jetty sidecar's filesystem module (filesystem-v1)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fsspec>=2023.12",     # the one dependency; everything else is stdlib
]

[project.entry-points."fsspec.specs"]
jetty = "jetty_fsspec:JettyFileSystem"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetty_fsspec"]
