# Jetty sidecar configuration. See SPEC.md.
#
# Nothing is enabled by default: a module runs only if it says so here.

[listener]
# Preferred transport: a unix socket, where filesystem permissions are the ACL
# and no token has to be distributed (SPEC.md §1.5).
uds = "/tmp/jetty/jetty.sock"
uds_mode = 0o660

# Loopback TCP alternative. The protocol defines no transport authentication,
# so a TCP listener is reachable by any process that can reach the address.
#   uds = ""
#   tcp = "127.0.0.1:7241"

[log]
level = "info"

# ---------------------------------------------------------------- modules

# The worked example / conformance fixture. Safe to leave on; it talks to
# nothing. See src/jetty/modules/reference/module.py.
[modules.reference]
enabled = true

# Read-only Mercurial API over the repositories under one root directory
# (spec/hg-v1.md): history, diffs, status and file content; no mutating
# endpoint. Requests pick a repository with `?repo=<name under root>`, and
# nothing outside the root is reachable. `root` is machine-specific, hence
# disabled here.
#
#   [modules.hg]
#   enabled = true
#   root = "/srv/checkouts"

# Specified in spec/auth-v1.md, not yet implemented. Enabling it today fails at
# boot with "unknown module" rather than serving stub answers to auth questions
# — which is the correct fail-closed behaviour for a security component.
#
#   [modules.auth]
#   enabled = true
#   driver = "mock"

# Specified in spec/llmproxy-v1.md, not yet implemented.
#
#   [modules.llmproxy]
#   enabled = true
#   driver = "mock"
#   listener = "127.0.0.1:7242"
#   surfaces = ["openai", "anthropic", "gemini"]

# Google Chat API v1 subset over a pluggable driver. See spec/chat-v1.md.
# This build ships the `mock` driver (in-memory, seedable — development, CI,
# conformance); `passthrough` is specified but not yet implemented.
#
#   [modules.chat]
#   enabled = true
#   driver = "mock"
#   upload_max_bytes = 26214400
#   # The service identity that created messages are attributed to (§2).
#   identity = "users/jetty"
#
#   # Mock driver seeding: spaces, members, and messages that exist at boot.
#   [[modules.chat.seed.spaces]]
#   id = "sandbox"
#   display_name = "Sandbox"
#   space_type = "SPACE"
#   members = ["users/operator"]
#
#   [[modules.chat.seed.messages]]
#   space = "sandbox"
#   sender = "users/operator"
#   text = "hello from the seed"
